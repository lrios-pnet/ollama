<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Soporte Técnico Senior</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 🔔 Aviso CPU -->
<div class="cpu-warning">
  Esta instancia está corriendo <strong>SOLO CPU</strong>, por lo tanto sé paciente al esperar la respuesta.
</div>

<div class="chat-app">
  <header class="chat-header">
    🛠️ Soporte Técnico Senior
  </header>

  <main id="messages" class="chat-body"></main>

  <footer class="chat-input">
    <textarea id="input" rows="1" placeholder="Escribí tu consulta…"></textarea>
    <button id="sendBtn">Enviar</button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
